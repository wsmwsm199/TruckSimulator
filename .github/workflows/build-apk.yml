name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi

          echo "Found: $ZIP"

          mkdir extracted
          unzip -q "$ZIP" -d extracted

          CONFIG=$(find extracted -name "capacitor.config.json" -type f | head -n 1)

          if [ -z "$CONFIG" ]; then
            echo "capacitor.config.json not found"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT=$(dirname "$CONFIG")

          echo "Project: $PROJECT"

          cp -r "$PROJECT"/. .

          if [ ! -f "www/index.html" ]; then
            echo "www/index.html not found"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Truck-Simulator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
